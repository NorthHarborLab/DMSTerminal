location = /dsm-terminal {
    return 302 /3rdparty/DSMTerminal/;
}

location ^~ /dsm-terminal/ {
    rewrite ^/dsm-terminal/(.*)$ /3rdparty/DSMTerminal/$1 redirect;
}

location = /3rdparty/DSMTerminal {
    return 301 /3rdparty/DSMTerminal/;
}

location ^~ /3rdparty/DSMTerminal/internal/ {
    return 404;
}

location = /3rdparty/DSMTerminal/api/auth/session {
    proxy_pass http://127.0.0.1:46880/api/auth/session;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-DSM-Server-Addr $server_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Syno-Token $http_x_syno_token;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_buffering off;
}

location ^~ /3rdparty/DSMTerminal/ {
    proxy_pass http://127.0.0.1:46880/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-DSM-Terminal-Proxy dsm-nginx-v1;
    proxy_set_header Cookie "";
    proxy_set_header X-Syno-Token "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
